name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate skill metadata
        run: python scripts/validate_skills.py
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run apple-mail unit tests
        run: pytest tests/test_validate_skill_catalog.py skills/apple-mail/tests/test_mail_meta.py -q
