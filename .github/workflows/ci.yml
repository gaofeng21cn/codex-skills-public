name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate skill metadata
        run: python scripts/validate_skills.py
      - name: Test task mode trigger contract
        run: python -m unittest tests/test_task_mode_gate.py
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run apple-apps unit tests
        run: pytest skills/apple-apps/tests/test_mail_meta.py -q
